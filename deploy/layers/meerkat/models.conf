# Meerkat 本地部署的模型选择 —— 供应商信息在 providers/ 目录下各自配置
# 改完后重跑：bash scripts/meerkat-local-up.sh

# 组织默认模型 & 界面下拉的默认选中（必须是某个 provider 已声明的模型 id）
MODEL_ID=kimi-k3

# 分类器路由（L1 local-secure / L3 meerkat-triz-v1）用的模型与 provider，通常与上面一致
ROUTE_MODEL_ID=kimi-k3          # 两个槽位（local / triz）共用的模型
ROUTE_PROVIDER_ID=kimi-code     # 该模型属于哪个供应商
