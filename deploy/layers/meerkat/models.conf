# Meerkat 本地部署的模型配置 —— 换模型只改这一个文件
# 改完后重跑：bash scripts/meerkat-local-up.sh

# 模型 id（界面下拉列表和组织默认模型都用它）
MODEL_ID=kimi-k2.6
# 模型在下拉列表里显示的名字
MODEL_NAME="Kimi K2.6"

# provider：模型从哪个服务调（PROTOCOL 只支持 openai / anthropic）
PROVIDER_ID=kimi-code
PROVIDER_NAME="Kimi Code"
BASE_URL=https://api.kimi.com/coding/v1
PROTOCOL=openai

# 模型能力参数（不知道就保持默认）
CONTEXT_WINDOW=262144
MAX_TOKENS=32768
