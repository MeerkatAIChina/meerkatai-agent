# Meerkat 本地部署的模型选择 —— 供应商信息在 providers/ 目录下各自配置
# 改完后重跑：bash scripts/meerkat-local-up.sh

# 组织默认模型 & 界面下拉的默认选中（必须是某个 provider 已声明的模型 id）
MODEL_ID=kimi-k3

# 分类器路由（L1 local-secure / L3 meerkat-triz-v1）用的模型与 provider，通常与上面一致
# scripts/meerkat-local-up.sh 会自动生成对应的 local-routes.json
ROUTE_MODEL_ID=kimi-k3          # 两个槽位（local / triz）共用的模型
ROUTE_PROVIDER_ID=kimi-code     # 该模型属于哪个供应商

# 开启语义分类器的模型判断能力（用的本地模型进行第三层语义判定），留空 = 关闭
# ENDPOINT 必须是完整的 chat completions 地址
# 注意：sidecar 发请求不带 Authorization 头，端点需免鉴权（如 Ollama）
SEMANTIC_ENDPOINT=http://47.117.35.137:18000/v1 # 例：http://127.0.0.1:11434/v1/chat/completions
SEMANTIC_MODEL=Meerkat-TRIZ-v1                  # 例：qwen3-7b-local


