# meerkat-triz 供应商配置
# key 不放这里：在仓库根 .env 里配 MEERKAT_TRIZ_API_KEY=...

PROVIDER_ID=meerkat-triz
PROVIDER_NAME="MeerkatAI"
PROTOCOL=openai
BASE_URL=http://47.117.35.137:18000/v1

# 这个供应商提供哪些模型（JSON 数组，可多个）
# modalities 声明输入模态：triz 是多模态模型，必须声明 image，否则图片会在发送前被平台降级为占位符
MODELS_JSON='[{"id":"meerkat-triz-v1","name":"Meerkat-TRIZ-v1","contextWindow":262144,"maxTokens":8192,"modalities":["text","image"]}]'
