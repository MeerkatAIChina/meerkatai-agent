# Kimi Code 供应商配置 —— 每个供应商一个这样的文件
# 文件名（不含 .conf）就是 PROVIDER_ID 的建议值
# key 不放这里：在仓库根 .env 里配 KIMI_CODE_API_KEY=sk-...（id 大写、横线变下划线 + _API_KEY）

PROVIDER_ID=kimi-code
PROVIDER_NAME="Kimi Code"
PROTOCOL=openai
BASE_URL=https://api.kimi.com/coding/v1

# 这个供应商提供哪些模型（JSON 数组，可多个）
MODELS_JSON='[{"id":"kimi-k3","name":"Kimi K3","contextWindow":262144,"maxTokens":32768},{"id":"kimi-k2.6","name":"Kimi K2.6","contextWindow":262144,"maxTokens":32768}]'
