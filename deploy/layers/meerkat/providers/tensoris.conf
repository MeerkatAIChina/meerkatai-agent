# Tensoris 中转站供应商配置（https://www.tensoris.ai/）
# OpenAI 兼容中转，可转发 gpt / claude / gemini 等系列模型
# key 不放这里：在仓库根 .env 里配 TENSORIS_API_KEY=sk-...

PROVIDER_ID=tensoris
PROVIDER_NAME="Tensoris"
PROTOCOL=openai
BASE_URL=https://api.tensoris.ai/v1

# 先接入两个模型，后续要加 gpt/claude/gemini 其他型号就往 MODELS_JSON 里追加
MODELS_JSON='[{"id":"gpt-5.4-nano","name":"GPT-5.4 Nano","contextWindow":128000,"maxTokens":8192},{"id":"gemini-3.1-flash-lite","name":"Gemini 3.1 Flash Lite","contextWindow":1000000,"maxTokens":8192}]'
