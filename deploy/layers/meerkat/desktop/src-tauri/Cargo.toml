[package]
name = "meerkat-desktop"
version = "0.1.2-alpha"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Com", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
