<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meerkat 会话锁定管理</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101216;
        --panel: #181b21;
        --line: #262b33;
        --text: #d7dbe0;
        --muted: #8b929c;
        --accent: #c85a3c;
        --green: #4cc38a;
        --red: #e06c75;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main { max-width: 720px; margin: 0 auto; padding: 20px 24px 32px; }
      .pagebar { display: flex; align-items: center; margin-bottom: 22px; }
      .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font: inherit;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        cursor: pointer;
      }
      .btn-back:hover { border-color: var(--accent); color: #fff; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 28px; line-height: 1.6; }
      .empty {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px 18px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .lock {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      .lock-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
      .lock-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .badge {
        font-size: 11px;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .lock-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; word-break: break-all; }
      .lock-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      select, input[type="text"] {
        font: inherit;
        font-size: 12px;
        padding: 7px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
      }
      .btn-retarget { background: var(--accent); color: #fff; }
      .btn-release { background: transparent; color: var(--red); border: 1px solid var(--red); }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { font-size: 13px; min-height: 20px; margin-top: 16px; line-height: 1.5; }
      #status.err { color: var(--red); }
      #status.ok { color: var(--green); }
    </style>
  </head>
  <body>
    <main>
      <div class="pagebar">
        <button id="backBtn" class="btn-back" type="button">← 返回对话</button>
      </div>
      <h1>会话锁定管理</h1>
      <p class="sub">
        被隐私防线锁定的会话会永久使用指定的本地模型。你可以把锁定重指到另一个可用模型，或解除锁定（解除后历史中的敏感内容可能随后续问题发往通用模型，请谨慎）。
      </p>
      <div id="list"><div class="empty">加载中…</div></div>
      <p id="status"></p>
    </main>
    <script>
      (function () {
        var KEY = "meerkat.portal_token";
        var portal = localStorage.getItem(KEY) || "";
        document.getElementById("backBtn").addEventListener("click", function () {
          location.href = portal ? "/?portal_token=" + encodeURIComponent(portal) : "/";
        });
        var list = document.getElementById("list");
        var status = document.getElementById("status");
        var modelOptions = [];

        function say(text, cls) {
          status.textContent = text;
          status.className = cls || "";
        }

        function api(path, method, body) {
          return fetch(path, {
            method: method,
            headers: { "content-type": "application/json", "x-portal-identity": portal },
            body: body ? JSON.stringify(body) : undefined,
          }).then(async function (r) {
            var data = await r.json().catch(function () { return {}; });
            if (!r.ok) throw new Error(data.message || data.error || String(r.status));
            return data;
          });
        }

        function loadModels() {
          return api("/api/runtime-config", "GET").then(function (cfg) {
            var byHarness = (cfg && cfg.modelsByHarness) || {};
            modelOptions = [];
            Object.keys(byHarness).forEach(function (h) {
              (byHarness[h] || []).forEach(function (m) {
                modelOptions.push({ harnessId: h, modelId: m });
              });
            });
          }).catch(function () { modelOptions = []; });
        }

        function render(locks) {
          if (!locks.length) {
            list.innerHTML = '<div class="empty">当前没有被锁定的会话。</div>';
            return;
          }
          list.innerHTML = "";
          locks.forEach(function (lock) {
            var el = document.createElement("div");
            el.className = "lock";

            var head = document.createElement("div");
            head.className = "lock-head";
            var title = document.createElement("div");
            title.className = "lock-title";
            title.textContent = lock.title || lock.sessionId;
            var badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "🔒 " + lock.harnessId + "/" + lock.modelId;
            head.appendChild(title);
            head.appendChild(badge);

            var meta = document.createElement("div");
            meta.className = "lock-meta";
            meta.textContent = "会话 " + lock.sessionId + (lock.scopeId ? " · " + lock.scopeId : "");

            var actions = document.createElement("div");
            actions.className = "lock-actions";

            var select = document.createElement("select");
            var placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "选择新模型…";
            select.appendChild(placeholder);
            modelOptions.forEach(function (opt) {
              var o = document.createElement("option");
              o.value = opt.harnessId + "|" + opt.modelId;
              o.textContent = opt.harnessId + "/" + opt.modelId;
              if (opt.harnessId === lock.harnessId && opt.modelId === lock.modelId) o.disabled = true;
              select.appendChild(o);
            });
            var custom = document.createElement("option");
            custom.value = "__custom";
            custom.textContent = "自定义模型 ID…";
            select.appendChild(custom);

            var customInput = document.createElement("input");
            customInput.type = "text";
            customInput.placeholder = "modelId（harness 默认 pi）";
            customInput.style.display = "none";

            select.addEventListener("change", function () {
              customInput.style.display = select.value === "__custom" ? "" : "none";
            });

            var retargetBtn = document.createElement("button");
            retargetBtn.className = "btn-retarget";
            retargetBtn.textContent = "重指";
            retargetBtn.addEventListener("click", function () {
              var target = null;
              if (select.value === "__custom") {
                var mid = customInput.value.trim();
                if (mid) target = { harnessId: "pi", modelId: mid };
              } else if (select.value) {
                var parts = select.value.split("|");
                target = { harnessId: parts[0], modelId: parts[1] };
              }
              if (!target) { say("请先选择或输入新模型。", "err"); return; }
              retargetBtn.disabled = true;
              api("/api/locks/" + lock.sessionId, "PUT", target)
                .then(function () { say("已将会话重指到 " + target.harnessId + "/" + target.modelId, "ok"); refresh(); })
                .catch(function (e) { say("重指失败：" + e.message, "err"); retargetBtn.disabled = false; });
            });

            var releaseBtn = document.createElement("button");
            releaseBtn.className = "btn-release";
            releaseBtn.textContent = "解除锁定";
            releaseBtn.addEventListener("click", function () {
              if (!confirm("解除锁定后，该会话将恢复按内容自动路由；历史中的敏感内容可能随后续问题发往通用模型。确认解除？")) return;
              releaseBtn.disabled = true;
              api("/api/locks/" + lock.sessionId, "DELETE")
                .then(function () { say("已解除锁定。", "ok"); refresh(); })
                .catch(function (e) { say("解锁失败：" + e.message, "err"); releaseBtn.disabled = false; });
            });

            actions.appendChild(select);
            actions.appendChild(customInput);
            actions.appendChild(retargetBtn);
            actions.appendChild(releaseBtn);

            el.appendChild(head);
            el.appendChild(meta);
            el.appendChild(actions);
            list.appendChild(el);
          });
        }

        function refresh() {
          api("/api/locks", "GET")
            .then(function (d) { render(d.locks || []); })
            .catch(function (e) {
              list.innerHTML = '<div class="empty">加载失败：' + e.message + "</div>";
            });
        }

        loadModels().then(refresh);
      })();
    </script>
  </body>
</html>
