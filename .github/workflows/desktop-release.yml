name: desktop-release
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Install web-ui build dependencies
        working-directory: plugins/web-ui
        run: npm ci --ignore-scripts

      - name: Stage payload
        shell: bash
        run: bash deploy/layers/meerkat/desktop/scripts/stage-payload.sh

      - name: Smoke payload
        shell: bash
        run: bash deploy/layers/meerkat/desktop/scripts/verify-payload.sh

      - name: Build and sign installers
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: deploy/layers/meerkat/desktop
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.target }}
